<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111321"><meta name="description" content="兩種關於靠近、牽引與放手的情緒互動概念體驗。"><title>之間 Between — 情緒互動展演</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"></head>
<body><canvas id="scene" aria-label="抽象視聽互動畫面"></canvas>
<main id="entrance"><header><a class="wordmark" href="./">之間 <span>between</span></a><span class="edition">互動展演 · 概念試作</span></header>
<div class="intro"><h1>有些感受，<br>在你與它之間。</h1><p>靠近、牽動，或只是停留。<br>讓你的動作，留下一點痕跡。</p></div>
<div class="choices" role="group" aria-label="選擇體驗方向"><button class="choice selected" data-mode="A" aria-pressed="true"><span class="choice-index">A</span><span><strong>呼吸之間</strong><small>靠近與停留</small></span><svg viewBox="0 0 80 60" aria-hidden="true"><ellipse cx="40" cy="30" rx="24" ry="22"/><ellipse cx="40" cy="30" rx="18" ry="17"/></svg></button><button class="choice" data-mode="B" aria-pressed="false"><span class="choice-index">B</span><span><strong>牽引之間</strong><small>牽動與放手</small></span><svg viewBox="0 0 80 60" aria-hidden="true"><path d="M15 40L40 15L65 40Z"/><circle cx="15" cy="40" r="4"/><circle cx="40" cy="15" r="4"/><circle cx="65" cy="40" r="4"/></svg></button></div>
<div class="start-row"><button id="start" class="primary">進入體驗 <span aria-hidden="true">↗</span></button><span>約 2 分 30 秒<br>建議電腦・戴上耳機</span></div>
<footer><span>概念 Demo，聲音為暫代素材</span><label class="volume-label">音量 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.35"></label><label><input id="reduced" type="checkbox"> 減少動態</label></footer></main>
<section id="experience" hidden><nav class="tools"><span id="mode-title">呼吸之間</span><div><button id="pause">暫停</button><button id="mute" aria-pressed="false">靜音</button><button id="exit">回到入口</button></div></nav><p id="hint" class="hint"></p><div id="pause-panel" class="overlay" hidden><p>讓時間，暫時停在這裡。</p><button id="resume" class="primary">繼續體驗</button></div><div id="ending" class="overlay" hidden><p>這一刻，留在這裡。</p><small>換一種方式靠近，也許會留下不同的痕跡。</small><div><button id="replay" class="primary">再停留一次</button><button id="home">回到入口</button></div></div></section>
<div id="audio-message" role="status" hidden>聲音尚未啟動，仍可體驗畫面。<button id="retry-audio">重試聲音</button></div><output id="debug" hidden></output><script type="module" src="./app.js"></script></body></html>
